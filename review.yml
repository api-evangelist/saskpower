aid: saskpower
name: SaskPower
review:
  question: >-
    Does SaskPower expose a consumer energy data API under any mandate, and does
    it publish open grid or market data?
  answer: >-
    No consumer data API and no mandate that would require one — Saskatchewan
    has no Green Button regulation and Canada has no national energy consumer
    data right — but a genuinely open, anonymous, entirely undocumented set of
    grid and outage data feeds does exist. This is the mirror image of the
    Ontario utilities: nothing compelled, nothing consented, yet more raw system
    data reachable without credentials.
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: utility-retailer

organization:
  legalName: Saskatchewan Power Corporation
  status: >-
    Provincial Crown corporation, owned by the Government of Saskatchewan
    through Crown Investments Corporation. Established 1929 as the Saskatchewan
    Power Commission; continued as the Saskatchewan Power Corporation in 1949
    under The Power Corporation Act. Governed by a board appointed by the
    Lieutenant Governor and reporting to a Minister Responsible.
  positionInValueChain: >-
    Vertically integrated monopoly — generation, transmission, distribution and
    retail in one entity. Saskatchewan has no competitive wholesale market
    operator equivalent to Ontario's IESO or Alberta's AESO, so there is no
    third-party market operator publishing system data on SaskPower's behalf and
    no market-facing API layer.
  scale: >-
    More than 550,000 customers across approximately 652,000 km2, more than
    160,000 km of power lines, roughly 5,437 MW of generating capacity across 31
    facilities (coal, natural gas, hydro, wind, solar), 59 switching stations and
    200 distribution stations, with interconnections to Manitoba, Alberta (HVDC)
    and North Dakota. Figures per the SaskPower entry on Wikipedia, cross-read
    against SaskPower's own system pages; SaskPower's /about-us page itself
    carries no company facts.

mandate:
  regime: none
  status: none
  instrument: >-
    None applies. Saskatchewan has enacted no Green Button regulation. Ontario's
    O. Reg. 633/21 (Energy Data, under the Electricity Act, 1998) binds Ontario
    local distribution companies only; Nova Scotia has a separate Green Button
    requirement on Nova Scotia Power. Neither reaches a Saskatchewan Crown
    corporation. Canada has no national energy consumer data right — the federal
    Consumer-Driven Banking framework covers financial data only — and Australia's
    Consumer Data Right (energy) has no Canadian analogue.
  appliesToThisOrganization: false
  appliesToThisOrganizationEvidence: >-
    The Green Button Alliance Canadian Initiatives page (HTTP 200, fetched
    2026-07-27) describes the Ontario regulation and the Nova Scotia Power
    requirement and then states explicitly: "We currently have no information
    about Green Button deployments in Manitoba, New Brunswick, Newfoundland and
    Labrador, Prince Edward Island, Quebec, or Saskatchewan." SaskPower is not
    named anywhere on that page. Independently, a site-wide search of
    saskpower.com returned no Green Button page: https://www.saskpower.com/green-button
    resolves to the site's soft-404 (HTTP 200 with <title>404</title>), and no
    smart meter, billing, or MySaskPower page mentions Green Button, ESPI, DMD,
    CMD, or third-party data sharing.
  whatWasVerified:
    - >-
      No Green Button surface of any kind. No DMD download, no CMD authorization
      endpoint, no third-party vendor onboarding form, no ESPI function-block
      scopes, no data-custodian paths.
    - >-
      No CDR-style accreditation regime exists in Canada for energy, so there is
      no register to check and no conformant base URI to look for.
  claimVersusImplementationNote: >-
    There is no compliance claim to test here. SaskPower makes no assertion of
    conformance to any energy data standard, so this record is "none" on both
    axes rather than the more common "mandated but not implemented." The
    interesting finding is the opposite direction: an organization with zero
    obligation nonetheless leaves real system data anonymously readable, purely
    as a side effect of how its public website is built.

dataStandard:
  name: no standard reference found
  detail: >-
    No Green Button / ESPI, no NAESB REQ.21, no CDR Consumer Data Standards, no
    OCPP or OCPI, no OpenADR, no IEEE 2030.5, and no IEC CIM 61968/61970
    reference appears anywhere on saskpower.com. The formats actually served are
    generic and proprietary in shape: an ad-hoc JSON object from a Sitecore
    controller, RSS 2.0 for planned outages, and KML 2.1 for the two map layers.
  payloadFormats:
    - application/json (Power Use Dashboard — proprietary shape)
    - RSS 2.0 XML (planned outages)
    - KML 2.1 XML (outage map, smart meter installation map)

consumerVersusMarketData:
  consumer_data_api: false
  consumerDataNote: >-
    A third party cannot obtain an individual SaskPower customer's usage or
    billing data through any documented API. Smart meter usage is presented only
    inside MySaskPower to the account holder. https://www.saskpower.com/Profile/My-Dashboard
    returned HTTP 200 but the body is a 486-byte auto-submitting form POSTing to
    /identity/externallogin?authenticationType=SaskPower.Azure.B2C — a Sitecore
    Identity handoff to Azure AD B2C. That is a human web login, not a delegated
    authorization surface: there is no consent screen for a third party, no
    client registration, no scopes, and no token endpoint offered to developers.
    No export format is advertised on the smart meter data pages.
  market_data_open: true
  marketDataNote: >-
    Recorded true, with the qualification stated plainly: the data is genuinely
    open and anonymous but entirely undocumented. Four live feeds were fetched
    with no credentials, no key and no signup on 2026-07-27, and all four parse:
    (1) https://www.saskpower.com/ignitionapi/PowerUseDashboard/GetPowerUseDashboardData
    — HTTP 200, application/json, 7,917 bytes, valid JSON, carrying systemDemand,
    systemSupply, generation, netInterchange, historicalPeakDemand, and a
    generationByType array with per-fuel MW, percentage and named facilities;
    (2) https://www.saskpower.com/ignitionapi/Content/GetRSSFeed — HTTP 200,
    text/xml, 13,058 bytes, valid RSS 2.0 of planned outages, opened by a visible
    "RSS feed" link on the planned-outage page; (3)
    https://outagemap.saskpower.com/Files/GetKmlFile — HTTP 200, text/xml,
    633,252 bytes, valid KML, referenced directly in the outage page markup;
    (4) https://www.saskpower.com/api/sitecore/Content/GetSmartMeterKmlFile —
    HTTP 200, 856,869 bytes, valid KML, referenced from the site's own
    SP.scripts.js. Electricity Maps lists SaskPower's "Where Your Power Comes
    From" page (daily average) as its Saskatchewan data source, confirming that
    third parties already depend on this surface — by scraping the page rather
    than by any published contract.
  theSplit: >-
    SaskPower is the inverse of Hydro One. Hydro One is compelled by regulation
    and has a real, standards-based, consent-gated consumer data API that no
    developer can discover, alongside zero open grid data. SaskPower is compelled
    by nothing, has no consumer data API at all, and yet leaves provincial
    generation mix, system demand, interchange and outage geometry sitting on
    open anonymous endpoints. Neither utility runs a developer program. The
    mandate produced an API without a developer surface; the absence of a mandate
    produced a developer surface without an API.

accessGate:
  gate: none-published
  whatADeveloperMustDo:
    - >-
      For the open data feeds: nothing. Issue an anonymous HTTPS GET. No account,
      no key, no header, no registration, no published rate limit. This is not a
      self-serve programme — there is nothing to sign up for — which is why the
      gate is recorded as none-published rather than self-serve.
    - >-
      For an individual customer's usage data: become that customer. Create a
      MySaskPower account and authenticate through Azure AD B2C. There is no path
      by which a third party can be authorized to read another person's data.
    - >-
      For anything SaskPower actually manages as an API: there is no published
      route. The historic developer portal at https://api-info.saskpower.com/
      (indexed by search engines as "Register for an Account - ESB - SaskPower",
      a TIBCO Cloud API Management / Mashery portal for SaskPower's Enterprise
      Service Bus) no longer resolves — NXDOMAIN on 8.8.8.8 and 1.1.1.1 as of
      2026-07-27, connection failures on every path probed. The gateway itself is
      still live: api.saskpower.com resolves via CNAME to saskpower1.api.mashery.com
      and every public path returns HTTP 596 with x-mashery-error-code
      ERR_596_SERVICE_NOT_FOUND from "Server: Mashery Proxy". Real services exist
      behind it; none are mapped to a public path and none are documented.
    - >-
      partner.saskpower.com resolves and 302s to login.microsoftonline.com
      (tenant dbe9bd7b-4b3a-44b3-b358-e61ff34d58b2, OpenID Connect,
      response_type=code id_token, scope=openid profile) — a partner portal
      behind corporate SSO, not a developer portal.
  selfServe: false
  developerPortalConfirmed: false
  notAnAccreditationRegime: >-
    Not applicable. With no mandate there is no accreditation, no register, and
    no regulator-defined data recipient status anywhere in Saskatchewan.

authModel:
  openDataFeeds: >-
    None. Anonymous unauthenticated HTTPS GET. No API key, no OAuth, no mTLS, no
    referer or origin restriction observed.
  customerPortal: >-
    Azure AD B2C via Sitecore Identity. Confirmed by the auto-POST form at
    https://www.saskpower.com/Profile/My-Dashboard targeting
    /identity/externallogin?authenticationType=SaskPower.Azure.B2C.
  partnerPortal: >-
    Microsoft Entra ID (Azure AD) OpenID Connect at partner.saskpower.com,
    tenant dbe9bd7b-4b3a-44b3-b358-e61ff34d58b2.
  apiGateway: >-
    TIBCO Cloud API Management (Mashery) at api.saskpower.com. Auth scheme not
    determinable — no service is publicly mapped.
  openidConnectDiscovery: >-
    Not served on the primary host. https://www.saskpower.com/.well-known/openid-configuration
    and /.well-known/oauth-authorization-server both return HTTP 200 but with
    text/html carrying <title>404</title> — the Sitecore soft-404, not a
    discovery document. Both were opened and confirmed to be HTML.
    https://api.saskpower.com/.well-known/openid-configuration returns HTTP 596.

downloadableContracts:
  found: false
  specsHarvested: 0
  openapiDirectory: none
  note: >-
    No machine-readable API contract of any kind is published. No OpenAPI, no
    Swagger, no WSDL, no Postman collection, no GraphQL schema, no AsyncAPI.
    https://www.saskpower.com/openapi.json and /swagger.json both return a genuine
    HTTP 404. /api-docs, /developers, /developer, /api, /apis, /docs, /data,
    /open-data, /opendata all return HTTP 200 carrying the Sitecore soft-404 page
    (<title>404</title>, 140,586 bytes, identical byte length across all of them);
    each was opened and confirmed to be the error page, so none is a portal. On
    the gateway, https://api.saskpower.com/openapi.json and /swagger.json both
    return HTTP 596 ERR_596_SERVICE_NOT_FOUND. Nothing was saved because nothing
    real exists to save.

