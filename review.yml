findings:
  summary: >-
    SaskPower is the control case for the energy mandate question: nothing
    obliges it to publish anything, and it has published no consumer data API,
    no Green Button surface, no standard, no portal and no contract. What it has
    is an accident. Four live endpoints — a JSON provincial supply feed, an RSS
    planned-outage feed, and two KML map layers — answer anonymous GETs with real,
    parseable grid data, because that is how the marketing website was built. No
    key, no signup, no documentation, no version, no rate limit, no promise. The
    only trace of a real API programme is archaeological: api.saskpower.com is a
    live TIBCO/Mashery gateway that refuses every public path with
    ERR_596_SERVICE_NOT_FOUND, and its developer portal at api-info.saskpower.com
    has stopped resolving entirely. Set against Ontario's mandated utilities, the
    contrast is exact and uncomfortable — regulation there produced a real
    standards-based consumer API that no developer can find, while the absence of
    regulation here produced open grid data that no developer is told about. In
    both cases the missing thing is the same: a developer programme.
  posture: unmandated-crown-monopoly-with-accidental-open-grid-data
  gated: false
  openapiHarvested: false
  specsHarvested: 0
