- aid: saskpower:saskpower-smart-meter-installation-map-kml-feed
  name: SaskPower Smart Meter Installation Map KML Feed
  description: >-
    The KML data feed behind SaskPower's Smart Meter Installation Map, requested
    by the site's own SP.scripts.js bundle and served anonymously from the
    Sitecore content handler. It returns a KML 2.1 document with styles for
    in-progress, coming-up, complete and unassigned deployment zones and polygon
    geometry for each named area of the province. Verified 2026-07-27 as HTTP
    200, 856,869 bytes, valid XML — served with Content-Type text/html despite
    the XML payload. This is deployment-programme data, not metering data: it
    shows where smart meters are being installed, never a reading. Undocumented,
    unversioned, and referenced only from JavaScript.
  humanURL: https://www.saskpower.com/our-power-future/investing-in-a-reliable-power-grid/smart-meters/meter-installation-map
  baseURL: https://www.saskpower.com/api/sitecore/Content/GetSmartMeterKmlFile
  tags:
