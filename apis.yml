apis:
- aid: saskpower:saskpower-power-use-dashboard-data
  name: SaskPower Power Use Dashboard Data
  description: >-
    The undocumented JSON endpoint behind SaskPower's public "Where Your Power
    Comes From" page. A single anonymous GET — no key, no signup, no referer
    check — returns the province's current supply picture: systemDemand,
    systemSupply, generation, netInterchange (negative when Saskatchewan is
    exporting), historicalPeakDemand with its date, and a generationByType array
    giving each fuel type (Hydro, Coal, Natural Gas, Wind, Solar, Other) its
    percentOfTotalGeneration, totalGenerationForType in MW, and the named
    powerUseFacilities contributing to it with links to each station's page.
    Verified 2026-07-27 as HTTP 200, application/json, 7,917 bytes, valid JSON.
    SaskPower publishes no reference, no schema, no version and no rate limit
    for it; it is a Sitecore controller action, not a product. Electricity Maps
    lists SaskPower's "Where Your Power Comes From" page as its Saskatchewan
    source, which is this same data read off the rendered page.
  humanURL: https://www.saskpower.com/our-power-future/our-electricity/electrical-system/where-your-power-comes-from
  baseURL: https://www.saskpower.com/ignitionapi/PowerUseDashboard/GetPowerUseDashboardData
  tags:
  - Grid
  - System Data
  - Generation Mix
  - Demand
  - Open Data
  - Undocumented
