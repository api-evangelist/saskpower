- aid: saskpower:saskpower-outage-map-kml-feed
  name: SaskPower Outage Map KML Feed
  description: >-
    The KML data feed behind SaskPower's public outage map, referenced directly
    in the markup of the Outage Map and Updates page and served anonymously from
    the outagemap.saskpower.com host. It returns a KML 2.1 document with styles
    for planned and unplanned outages and polygon geometry for affected areas.
    Verified 2026-07-27 as HTTP 200, text/xml, 633,252 bytes, valid XML. No
    documentation, schema, or terms are published for the feed itself; the map
    page it drives is the only human surface.
  humanURL: https://www.saskpower.com/outages/power-outages/outage-updates
  baseURL: https://outagemap.saskpower.com/Files/GetKmlFile
  tags:
