- aid: saskpower:saskpower-planned-outages-rss-feed
  name: SaskPower Planned Outages RSS Feed
  description: >-
    A genuinely published, anonymous RSS 2.0 feed of SaskPower's planned power
    outages, opened by the visible "RSS feed" link on the Outages Planned for
    Necessary Maintenance page. Each item carries a title naming the area and
    date, a pubDate, and a CDATA description listing the towns and urban
    municipalities affected, the outage date and time window, the outage reason,
    and additional comments including reschedules. The feed's self-declared
    atom:link points at http://www.saskpower.com/feeds/outages.xml, which is
    dead — that path returns a SaskPower 500 error page — so the working
    location is the /ignitionapi/Content/GetRSSFeed endpoint the page's own
    JavaScript opens. Verified 2026-07-27 as HTTP 200, text/xml, 13,058 bytes,
    valid XML.
  humanURL: https://www.saskpower.com/outages/power-outages/outages-planned-for-necessary-maintenance
  baseURL: https://www.saskpower.com/ignitionapi/Content/GetRSSFeed
  tags:
  - Outages
  - RSS
  - Grid
  - Open Data
  properties:
  - type: Documentation
    url: https://www.saskpower.com/outages/power-outages/outages-planned-for-necessary-maintenance
  - type: TermsOfService
    url: https://www.saskpower.com/terms
  - type: Examples
    name: Verbatim live RSS capture 2026-07-27
    url: examples/saskpower-planned-outages-rss.xml
- aid: saskpower:saskpower-live-outage-json-feed
  name: SaskPower Live Outage JSON Feed
  description: >-
    The undocumented JSON endpoint behind SaskPower's public outage map, found in
    the markup of the Outage Map and Updates page alongside the KML reference and
    fetched anonymously with no key, no signup and no referer check. A single GET
    returns Outages[] — one entry per affected service region — each carrying an
    integer OutageId (the same identifier space as the planned-outage RSS guids),
    an integer RegionId that joins to the outage-map KML regions and to that
    feed's ?rid= parameter, a human-readable Region name, a Planned field valued
    "Planned" or "Unplanned", and an Alerts array of operator-written
    {CreateDate, Message} notices. It is wrapped in the shared Sitecore controller
    envelope {errorCode, errorMessage, errorDetails, callId, time}, where
    errorCode 0 means success and the HTTP status stays 200 even on failure.
    Verified 2026-07-27 as HTTP 200, application/json, 4,256 bytes, valid JSON,
    13 outages. This is the closest thing SaskPower has to a live grid-events
    API, and it is documented nowhere.
  humanURL: https://www.saskpower.com/outages/power-outages/outage-updates
  baseURL: https://www.saskpower.com/api/sitecore/Content/GetOutageJsonFile
