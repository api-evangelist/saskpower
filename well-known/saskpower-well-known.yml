note: >-
  No /.well-known/ discovery surface exists on any SaskPower host. Every candidate
  below was fetched and its body inspected; none returned a parseable discovery
  document, so no raw files were saved and no `WellKnown` or `SecurityTxt` pointer
  is wired. Reading the status codes needs care on this estate, because each host
  fails differently: www.saskpower.com returns a genuine IIS `404 - File or
  directory not found` for /.well-known/security.txt, /security.txt,
  /.well-known/ai-plugin.json, /llms.txt and /robots.txt, but 302-redirects
  /.well-known/openid-configuration, /.well-known/oauth-authorization-server,
  /.well-known/oauth-protected-resource and /.well-known/api-catalog into the
  Sitecore soft-404 handler at /404?item=<path>&user=extranet%5cAnonymous&site=SaskPower
  (which then answers HTTP 200 with <title>404</title>). outagemap.saskpower.com
  302s every /.well-known/ path. api.saskpower.com — the live TIBCO Cloud API
  Management (Mashery) gateway — answers every path with HTTP 596
  x-mashery-error-code ERR_596_SERVICE_NOT_FOUND. A 200 or a 302 on this estate is
  therefore not evidence of a document; only the body is.
