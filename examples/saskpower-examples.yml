source: live anonymous HTTPS GETs against SaskPower's public endpoints, 2026-07-27
note: >-
  SaskPower publishes no OpenAPI, no schema and no reference documentation for any
  of its data endpoints, so there are no provider-published examples to harvest.
  What is captured here instead is the real thing: the actual response bodies
  returned by each anonymous endpoint on 2026-07-27, saved verbatim. Nothing was
  edited, reformatted or synthesised. Where a payload is very large (the two KML
  documents are 620-840 KB and carry 494 Placemark elements each) an excerpt was
  saved, truncated after the second Placemark and marked as an excerpt inside the
  file itself; the JSON and RSS payloads are complete and unmodified.
  These captures are the evidence base for json-schema/, conventions/ and errors/.
